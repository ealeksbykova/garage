spring:
  datasource:
    url: ${GARAGE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${GARAGE_DB_USER:postgres}
    password: ${GARAGE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

server:
  address: 127.0.0.1
  port: ${GARAGE_PORT:8080}
