spring:
  datasource:
    url: jdbc:sqlite:./data/app.db?foreign_keys=on&date_string_format=yyyy-MM-dd'T'HH:mm:ss.SSS
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_java_type_jdbc_types:
            java.lang.Long: INTEGER
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

server:
  port: 8080