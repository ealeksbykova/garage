$kind: http-request
name: Delete Engine
method: DELETE
url: '{{baseUrl}}/api/engines/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{engineId}}'
    description: UUID of the engine to delete
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", function () {
          pm.response.to.have.status(204);
      });
