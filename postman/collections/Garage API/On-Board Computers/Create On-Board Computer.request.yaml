$kind: http-request
name: Create On-Board Computer
method: POST
url: '{{baseUrl}}/api/on-board-computers'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firmwareVersion": "2.4.1",
      "cpuModel": "ARM Cortex-A53",
      "ramMb": 512
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response has id", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.collectionVariables.set("onBoardComputerId", json.id);
      });
      pm.test("firmwareVersion matches request", function () {
          const json = pm.response.json();
          pm.expect(json.firmwareVersion).to.eql("2.4.1");
      });
