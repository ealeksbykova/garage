$kind: http-request
name: Delete Transmission
method: DELETE
url: '{{baseUrl}}/api/transmissions/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{transmissionId}}'
    description: UUID of the transmission to delete
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", function () {
          pm.response.to.have.status(204);
      });
