$kind: http-request
name: Create Transmission
method: POST
url: '{{baseUrl}}/api/transmissions'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "transmissionType": "AUTOMATIC",
      "gearsCount": 8,
      "serialNumber": "TRN-001-2024"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response has id", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.collectionVariables.set("transmissionId", json.id);
      });
      pm.test("transmissionType matches request", function () {
          const json = pm.response.json();
          pm.expect(json.transmissionType).to.eql("AUTOMATIC");
      });
