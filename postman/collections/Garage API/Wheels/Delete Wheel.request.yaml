$kind: http-request
name: Delete Wheel
method: DELETE
url: '{{baseUrl}}/api/wheels/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{wheelId}}'
    description: UUID of the wheel to delete
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", function () {
          pm.response.to.have.status(204);
      });
