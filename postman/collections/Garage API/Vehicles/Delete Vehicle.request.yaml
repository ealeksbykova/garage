$kind: http-request
name: Delete Vehicle
method: DELETE
url: '{{baseUrl}}/api/vehicles/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{vehicleId}}'
    description: UUID of the vehicle to delete
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", function () {
          pm.response.to.have.status(204);
      });
